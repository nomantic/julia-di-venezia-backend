# Local database and auxiliary services for local development
name: 'julia-di-venezia-dev'

services:
  postgres_db:
    image: postgres:16-alpine
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: julia_vendure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword

volumes:
  postgres_db_data:
